<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کیپیٹل کھاتہ - ڈیجیٹل رجسٹر</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 10px; text-align: right; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2, h3 { margin: 0 0 10px 0; color: #1a252f; text-align: center; }
        p { margin: 3px 0; color: #555; font-size: 13px; text-align: center; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        button.btn-sec { background-color: #2980b9; }
        button.btn-danger { background-color: #c0392b; }
        .tab-btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn-group button { flex: 1; padding: 8px 0; font-size: 12px; background: #7f8c8d; }
        .tab-btn-group button.active { background: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="container">

    <!-- دکان کی ہیڈر انفارمیشن -->
    <div class="card" style="border-top: 4px solid #27ae60;">
        <h2 id="dispShopName">Capital Sofa Zone</h2>
        <p id="dispShopDetails">فون: 03000000000 | پتہ: مین بازار</p>
    </div>

    <!-- نیویگیشن ٹیبز -->
    <div class="tab-btn-group">
        <button class="active" onclick="showTab('khataTab', this)">کیش بک</button>
        <button onclick="showTab('stockTab', this)">سٹاک</button>
        <button onclick="showTab('backupTab', this)">بیک اپ</button>
        <button onclick="showTab('settingsTab', this)">سیٹنگز</button>
    </div>

    <!-- 1️⃣ کیش بک / سیل و پرچیز ٹیب -->
    <div id="khataTab" class="tab-content active">
        <div class="card">
            <h3>نیا اینٹری درج کریں</h3>
            <select id="txType">
                <option value="سیل (فروخت)">سیل (فروخت)</option>
                <option value="پرچیز (خریداری)">پرچیز (خریداری)</option>
            </select>
            <input type="text" id="custName" placeholder="کسٹمر / سپلائر کا نام">
            <input type="text" id="custPhone" placeholder="واٹس ایپ نمبر (مثال: 923001234567)">
            <input type="text" id="itemName" placeholder="سامان / پروڈکٹ کا نام">
            <input type="number" id="txAmount" placeholder="رقم (Rs)">
            <button onclick="addTransaction()">اینٹری محفوظ کریں</button>
        </div>

        <div class="card">
            <h3>حالیہ کھاتہ ہسٹری</h3>
            <table>
                <thead>
                    <tr>
                        <th>قسم</th>
                        <th>نام</th>
                        <th>رقم</th>
                        <th>واٹس ایپ</th>
                    </tr>
                </thead>
                <tbody id="txTable"></tbody>
            </table>
        </div>
    </div>

    <!-- 2️⃣ سٹاک رجسٹر ٹیب -->
    <div id="stockTab" class="tab-content">
        <div class="card">
            <h3>نیا سٹاک شامل کریں</h3>
            <input type="text" id="stkItem" placeholder="آئٹم کا نام">
            <input type="number" id="stkQty" placeholder="تعداد (تھان / پیس)">
            <button class="btn-sec" onclick="addStock()">سٹاک اپ ڈیٹ کریں</button>
        </div>
        <div class="card">
            <h3>موجودہ سٹاک</h3>
            <table>
                <thead>
                    <tr>
                        <th>آئٹم</th>
                        <th>تعداد</th>
                    </tr>
                </thead>
                <tbody id="stockTable"></tbody>
            </table>
        </div>
    </div>

    <!-- 3️⃣ بیک اپ اور ڈاٹا ریکوری ٹیب -->
    <div id="backupTab" class="tab-content">
        <div class="card">
            <h3>ڈیٹا بیک اپ و ریکوری</h3>
            <p>اپنے تمام کھاتوں کا ڈیٹا کمپیوٹر/موبائل میں محفوظ کریں:</p>
            <button class="btn-sec" onclick="downloadBackup()">بیک اپ فائل ڈاؤن لوڈ کریں</button>
            <hr>
            <p>پرانا بیک اپ فائل اپ لوڈ کریں:</p>
            <input type="file" id="restoreFile" accept=".json">
            <button onclick="restoreBackup()">ڈیٹا بحال (Restore) کریں</button>
        </div>
    </div>

    <!-- 4️⃣ دکان کی سیٹنگز ٹیب -->
    <div id="settingsTab" class="tab-content">
        <div class="card">
            <h3>دکان سیٹنگز</h3>
            <label>دکان کا نام:</label>
            <input type="text" id="setShopName" placeholder="دکان کا نام درج کریں">
            <label>رابطہ نمبر و پتہ:</label>
            <input type="text" id="setShopDetails" placeholder="فون نمبر اور پتہ">
            <button onclick="saveSettings()">سیٹنگز محفوظ کریں</button>
        </div>
    </div>

</div>

<script>
    // ڈیٹا ہولڈرز (خودکار LocalStorage)
    let transactions = JSON.parse(localStorage.getItem('app_txs')) || [];
    let stock = JSON.parse(localStorage.getItem('app_stock')) || [];
    let settings = JSON.parse(localStorage.getItem('app_settings')) || {
        name: 'Capital Sofa Zone',
        details: 'فون: 03000000000 | پتہ: مین بازار'
    };

    // ٹیب تبدیل کرنے کا فنکشن
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn-group button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // سیٹنگز لوڈ اور سیو
    function loadSettings() {
        document.getElementById('dispShopName').innerText = settings.name;
        document.getElementById('dispShopDetails').innerText = settings.details;
        document.getElementById('setShopName').value = settings.name;
        document.getElementById('setShopDetails').value = settings.details;
    }

    function saveSettings() {
        settings.name = document.getElementById('setShopName').value;
        settings.details = document.getElementById('setShopDetails').value;
        localStorage.setItem('app_settings', JSON.stringify(settings));
        loadSettings();
        alert('سیٹنگز کامیابی سے محفوظ ہو گئیں!');
    }

    // اینٹری شامل کرنا
    function addTransaction() {
        let type = document.getElementById('txType').value;
        let name = document.getElementById('custName').value;
        let phone = document.getElementById('custPhone').value;
        let item = document.getElementById('itemName').value;
        let amount = document.getElementById('txAmount').value;

        if(!name || !amount) { alert('نام اور رقم ضروری ہیں!'); return; }

        transactions.push({ type, name, phone, item, amount });
        localStorage.setItem('app_txs', JSON.stringify(transactions));
        renderTx();
        
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('txAmount').value = '';
    }

    function renderTx() {
        let tbody = document.getElementById('txTable');
        tbody.innerHTML = '';
        transactions.forEach(tx => {
            let msg = `محترم ${tx.name}!%0Aآپ کا ${tx.type} بل برائے ${tx.item} Rs. ${tx.amount} ہے۔%0Aشکریہ!%0A*${settings.name}*`;
            let waUrl = `https://wa.me/${tx.phone}?text=${msg}`;
            
            tbody.innerHTML += `
                <tr>
                    <td>${tx.type}</td>
                    <td>${tx.name}</td>
                    <td>Rs. ${tx.amount}</td>
                    <td><a href="${waUrl}" target="_blank"><button style="padding:3px 6px; background:#25D366;">بھیجیں</button></a></td>
                </tr>
            `;
        });
    }

    // سٹاک شامل کرنا
    function addStock() {
        let item = document.getElementById('stkItem').value;
        let qty = document.getElementById('stkQty').value;
        if(!item || !qty) return;

        stock.push({ item, qty });
        localStorage.setItem('app_stock', JSON.stringify(stock));
        renderStock();
        document.getElementById('stkItem').value = '';
        document.getElementById('stkQty').value = '';
    }

    function renderStock() {
        let tbody = document.getElementById('stockTable');
        tbody.innerHTML = '';
        stock.forEach(s => {
            tbody.innerHTML += `<tr><td>${s.item}</td><td>${s.qty}</td></tr>`;
        });
    }

    // بیک اپ ڈاؤن لوڈ
    function downloadBackup() {
        let data = { transactions, stock, settings };
        let blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Khata_Backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    // بیک اپ ری اسٹور
    function restoreBackup() {
        let fileInput = document.getElementById('restoreFile');
        if(!fileInput.files[0]) { alert('فائل منتخب کریں!'); return; }
        
        let reader = new FileReader();
        reader.onload = function(e) {
            let data = JSON.parse(e.target.result);
            if(data.transactions) localStorage.setItem('app_txs', JSON.stringify(data.transactions));
            if(data.stock) localStorage.setItem('app_stock', JSON.stringify(data.stock));
            if(data.settings) localStorage.setItem('app_settings', JSON.stringify(data.settings));
            location.reload();
        };
        reader.readAsText(fileInput.files[0]);
    }

    // شروعاتی لوڈ
    loadSettings();
    renderTx();
    renderStock();
</script>

</body>
</html>
