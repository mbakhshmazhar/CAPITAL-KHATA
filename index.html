<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Khata Pro</title>
    
    <!-- PWA Manifest & Theme Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/552/552788.png">

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; padding: 12px; text-align: right; }
        .container { max-width: 600px; margin: auto; }

        .app-header { background: #d32f2f; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .app-header h2 { font-size: 20px; }

        .install-banner { display: none; background: #27ae60; color: white; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .install-btn { background: white; color: #27ae60; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); text-align: center; }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="app-header">
        <h2>CAPITAL KHATA</h2>
        <p>PWA Ready Application</p>
    </div>

    <!-- PWA Installation Banner -->
    <div id="installBanner" class="install-banner">
        <span>📲 اس ایپ کو موبائل یا پی سی پر انسٹال کریں!</span><br>
        <button class="install-btn" onclick="installPWA()">انسٹال کریں (Install)</button>
    </div>

    <div class="box">
        <h3>✅ PWA سیٹ اپ مکمل ہے!</h3>
        <p style="margin-top: 10px; color: #555;">یہ اپلی کیشن اب آف لائن بھی کام کرے گی اور اسے ہوم اسکرین پر انسٹال کیا جا سکتا ہے۔</p>
    </div>

</div>

<script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker Registered!', reg))
                .catch(err => console.log('Service Worker Failed!', err));
        });
    }

    // Handle PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBanner').style.display = 'block';
    });

    function installPWA() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    document.getElementById('installBanner').style.display = 'none';
                }
                deferredPrompt = null;
            });
        }
    }
</script>

</body>
</html>
