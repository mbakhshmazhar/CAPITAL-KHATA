<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Khata Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .app-header {
            background: #d32f2f;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .app-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .address-bar {
            font-size: 12px;
            opacity: 0.95;
            line-height: 1.4;
            direction: ltr;
            margin-top: 8px;
            background: rgba(0,0,0,0.15);
            padding: 8px;
            border-radius: 6px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .summary-box {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .summary-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
        }

        .credit { background: #e8f5e9; color: #2e7d32; }
        .debit { background: #ffebee; color: #c62828; }

        .summary-item h3 { font-size: 14px; margin-bottom: 5px; }
        .summary-item p { font-size: 18px; font-weight: bold; }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-in { background: #2e7d32; }
        .btn-out { background: #c62828; }

        .history-list {
            list-style: none;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .history-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <h1>CAPITAL KHATA</h1>
            <p>MUHAMMAD Bakhsh Mazhar | 03457059667</p>
            <div class="address-bar">
                House No. 181/I Street No. 62 Near Waris Khan Metro Station Murree Road Rawalpindi
            </div>
        </div>

        <!-- Summary -->
        <div class="card summary-box">
            <div class="summary-item credit">
                <h3>وصولی (In)</h3>
                <p>Rs. 0</p>
            </div>
            <div class="summary-item debit">
                <h3>واجب الادا (Out)</h3>
                <p>Rs. 0</p>
            </div>
        </div>

        <!-- Transaction Form -->
        <div class="card">
            <h2 style="font-size: 16px; margin-bottom: 15px;">نیا اندراج کریں</h2>
            <div class="form-group">
                <label>گاہک / پارٹی کا نام</label>
                <input type="text" placeholder="نام درج کریں">
            </div>
            <div class="form-group">
                <label>رقم (روپے)</label>
                <input type="number" placeholder="0">
            </div>
            <div class="form-group">
                <label>تفصیل / تفصیلات</label>
                <input type="text" placeholder="تفصیل لکھیں">
            </div>
            <div class="btn-group">
                <button class="btn-in">رقم مل گئی (+)</button>
                <button class="btn-out">رقم دے دی (-)</button>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="card">
            <h2 style="font-size: 16px; margin-bottom: 15px;">حالیہ لین دین</h2>
            <ul class="history-list">
                <li class="history-item">
                    <div>
                        <strong>مثال گاہک</strong>
                        <div style="font-size: 12px; color: #777;">تفصیل یہاں آئے گی</div>
                    </div>
                    <div style="color: #2e7d32; font-weight: bold;">+ Rs. 0</div>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
