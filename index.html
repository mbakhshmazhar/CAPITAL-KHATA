<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPITAL KHATA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-container {
            width: 100%;
            max-width: 650px;
            min-height: 380px;
            /* اگر تصویر کا نام bg-gold.jpg ہے تو یہاں وہی رہے گا */
            background-image: url('images/bg-gold.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: #ffffff;
        }

        .logo-box {
            background-color: #ffffff;
            color: #333333;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .details {
            font-size: 16px;
            line-height: 1.8;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .address {
            margin-top: 5px;
            font-size: 15px;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- لوگو/ٹائٹل باکس -->
        <div class="logo-box">
            CAPITAL KHATA
        </div>

        <!-- نام -->
        <div class="name">
            MUHAMMAD Bakhsh Mazhar
        </div>

        <!-- رابطہ اور نیا ایڈریس -->
        <div class="details">
            <div>03457059667</div>
            <div>mbakhshmazhar@gmail.com</div>
            <div class="address">
                House No. 181/I Street No. 62 Near Waris Khan Metro Station Murree Road Rawalpindi
            </div>
        </div>
    </div>

</body>
</html>
